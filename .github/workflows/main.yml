name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decompresser le projet
        run: unzip -q VersetDuJour-android.zip -d projet

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK
        working-directory: projet/VersetDuJour
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renommer l'APK
        run: cp projet/VersetDuJour/app/build/outputs/apk/debug/app-debug.apk VersetDuJour.apk

      - name: Publier l'APK a telecharger
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Verset du jour (version ${{ github.run_number }})
          files: VersetDuJour.apk
          make_latest: true
